name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: RESEND_API_KEY
          script: |
            set -euo pipefail

            echo "=== Host info ==="
            hostname
            date -u

            echo ""
            echo "=== ceefaxweb systemd unit (as running) ==="
            systemctl show ceefaxweb -p ExecStart -p WorkingDirectory -p FragmentPath
            echo ""
            systemctl status ceefaxweb --no-pager || true

            echo ""
            echo "=== Locate repo directory ==="
            # Support older server layouts that still use ceefax_station_website.
            REPO_DIR="/root/ceefax_station"
            if [ -d "/root/ceefax_station_website/.git" ] && [ ! -d "/root/ceefax_station/.git" ]; then
              REPO_DIR="/root/ceefax_station_website"
            fi
            echo "Using REPO_DIR=${REPO_DIR}"

            echo ""
            echo "=== Repo status (${REPO_DIR}) BEFORE update ==="
            cd "${REPO_DIR}"
            git remote -v
            git rev-parse --short HEAD || true
            git log -1 --oneline || true

            echo ""
            echo "=== Update repo to origin/main ==="
            # Ensure origin points to the renamed repo
            git remote set-url origin https://github.com/thaum-labs/ceefax_station.git
            git fetch origin
            git reset --hard origin/main
            git rev-parse --short HEAD
            git log -1 --oneline

            echo ""
            echo "=== Upsert RESEND_API_KEY into repo .env (value hidden) ==="
            if [ -z "${RESEND_API_KEY:-}" ]; then
              echo "RESEND_API_KEY secret not provided; leaving .env unchanged"
            else
              RESEND_ENV_FILE="${REPO_DIR}/.env" python3 -c "import os, pathlib, re; p=pathlib.Path(os.environ['RESEND_ENV_FILE']); k=(os.environ.get('RESEND_API_KEY') or '').strip(); assert k, 'empty key'; t=p.read_text(encoding='utf-8') if p.is_file() else ''; t=re.sub(r'^RESEND_API_KEY=.*$', 'RESEND_API_KEY=' + k, t, count=1, flags=re.M) if re.search(r'^RESEND_API_KEY=', t, re.M) else ((t if t.endswith(chr(10)) or t=='' else t+chr(10)) + 'RESEND_API_KEY=' + k + chr(10)); p.write_text(t, encoding='utf-8'); os.chmod(p, 0o600); print('RESEND_API_KEY present in .env')"
            fi

            echo ""
            echo "=== Replace SM6OPW with TEST1 (one-time) ==="
            cd "${REPO_DIR}"
            echo "yes" | python3 -m ceefaxweb.scripts.replace_callsign SM6OPW TEST1 2>&1 || echo "Replacement check completed (SM6OPW may not exist or already replaced)"

            echo ""
            echo "=== Delete sample data (do not re-seed demo stations) ==="
            cd "${REPO_DIR}"
            set -a
            # shellcheck disable=SC1091
            [ -f "${REPO_DIR}/.env" ] && . "${REPO_DIR}/.env"
            set +a
            if [ -x "${REPO_DIR}/venv/bin/python" ]; then
              PY="${REPO_DIR}/venv/bin/python"
            else
              PY="python3"
            fi
            echo "Using DB=${CEEFAXWEB_DB:-"(default)"}"
            echo "yes" | "${PY}" -m ceefaxweb.scripts.delete_sample_data --confirm 2>&1 || echo "Sample data deletion completed (may have no sample data)"

            echo ""
            echo "=== Install / refresh hub page pack timer ==="
            cd "${REPO_DIR}"
            mkdir -p "${REPO_DIR}/ceefaxweb/data/page_pack"
            if [ -f "${REPO_DIR}/ceefaxweb/systemd/ceefax-hub-pages.service" ]; then
              # Unit files in repo default to /root/ceefax_station; rewrite for this host path.
              sed "s|/root/ceefax_station|${REPO_DIR}|g" \
                "${REPO_DIR}/ceefaxweb/systemd/ceefax-hub-pages.service" \
                > /etc/systemd/system/ceefax-hub-pages.service
              cp "${REPO_DIR}/ceefaxweb/systemd/ceefax-hub-pages.timer" /etc/systemd/system/ceefax-hub-pages.timer
              systemctl daemon-reload
              systemctl enable --now ceefax-hub-pages.timer || true
              # Best-effort first publish (needs API keys in ${REPO_DIR}/.env)
              if [ -x "${REPO_DIR}/venv/bin/python" ]; then
                set -a
                # shellcheck disable=SC1091
                [ -f "${REPO_DIR}/.env" ] && . "${REPO_DIR}/.env"
                set +a
                "${REPO_DIR}/venv/bin/python" -m ceefaxweb.refresh_hub_pages || echo "Hub page refresh skipped/failed (check API keys in .env)"
              else
                python3 -m ceefaxweb.refresh_hub_pages || echo "Hub page refresh skipped/failed (check API keys in .env)"
              fi
            fi

            echo ""
            echo "=== Restart ceefaxweb ==="
            systemctl restart ceefaxweb
            sleep 2
            systemctl status ceefaxweb --no-pager || true

            echo ""
            echo "=== Upload notify config (no secrets) ==="
            if [ -x "${REPO_DIR}/venv/bin/python" ]; then
              PY="${REPO_DIR}/venv/bin/python"
            else
              PY="python3"
            fi
            cd "${REPO_DIR}"
            "${PY}" -c "from ceefaxweb.envfile import load_repo_dotenv; from ceefaxweb.notify import notify_config; load_repo_dotenv(); c=notify_config(); print('notify_enabled', c['enabled']); print('notify_to', ', '.join(c['to'])); print('notify_from', c['from'])"

            echo ""
            echo "=== Local health checks (localhost) ==="
            # These should return 200 when the new routes are live.
            curl -sS -i http://127.0.0.1:8088/api/version || true
            echo ""
            curl -sS -i http://127.0.0.1:8088/changelog || true
            echo ""
            curl -sS -i http://127.0.0.1:8088/api/changelog || true
            echo ""
            curl -sS -i http://127.0.0.1:8088/api/pages/manifest || true

