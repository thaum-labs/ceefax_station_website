name: Build Debian package

on:
  push:
    branches:
      - main
    paths:
      - "ceefax/**"
      - "ceefaxstation/**"
      - "packaging/**"
      - "scripts/build_debian_package.py"
      - "VERSION"
      - ".github/workflows/build-debian.yml"
  pull_request:
    paths:
      - "ceefax/**"
      - "ceefaxstation/**"
      - "packaging/**"
      - "scripts/build_debian_package.py"
      - "tests/test_debian_package.py"
      - "tests/test_paths.py"
      - "VERSION"
      - ".github/workflows/build-debian.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest requests beautifulsoup4

      - name: Test packaging
        run: python -m pytest tests/test_debian_package.py tests/test_paths.py tests/test_self_update.py -q

      - name: Build .deb
        run: python scripts/build_debian_package.py --output-dir installers

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceefax-station-deb
          path: installers/*.deb

      - name: Attach to existing GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL="$(tr -d '[:space:]' < VERSION)"
          TAG="v${LABEL%%-*}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/ceefax-station.deb installers/ceefax-station_*.deb --clobber
            echo "Uploaded Debian package to $TAG"
          else
            echo "No GitHub release $TAG yet; artifact only"
          fi
